---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kube-zs24b-spell-server
spec:
  chart:
    spec:
      chart: ./deploy/spell-server
      sourceRef:
        kind: GitRepository
        name: spell-repo
        namespace: flux-system
  interval: 10m0s
  valuesFrom:
  - kind: ConfigMap
    name: kube-zs24b-spell-release
    valuesKey: kube-ses24-values.yaml
