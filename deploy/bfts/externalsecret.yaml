apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spell-git-access
spec:
  refreshInterval: "15s" # synchronisation
  secretStoreRef:
    name: spell-vault-backend
    kind: SecretStore
 
  data:
    - secretKey: id_rsa
      remoteRef:
        key:  /spell-git-access
        property: id_rsa
    - secretKey: id_rsa.pub
      remoteRef:
        key:  /spell-git-access
        property: id_rsa.pub
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ldap-secret
spec:
  refreshInterval: "15s" # synchronisation
  secretStoreRef:
    name: spell-vault-backend
    kind: SecretStore
  data:
    - secretKey: ldap-secret
      remoteRef:
        key:  /ldap-secret
        property: ldap-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ses24-encryption-keys
spec:
  refreshInterval: "15s" # synchronisation
  secretStoreRef:
    name: spell-vault-backend
    kind: SecretStore

  dataFrom:
  - extract:
      key: /ses24-encryption
      decodingStrategy: Auto

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ses24-encryption-cert
spec:
  refreshInterval: "15s" # synchronisation
  secretStoreRef:
    name: spell-vault-backend
    kind: SecretStore
    
  data:
    - secretKey: ses24_rsa.pem
      remoteRef:
        key:  /ses24-encryption
        property: ses24_rsa.pem
