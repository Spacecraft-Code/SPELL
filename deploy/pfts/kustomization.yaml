apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: spell
resources:
- ../spell-registry/
- secretstore.yaml
- externalsecret.yaml
- missions/ses24/
- flux-policies/imagepolicy.yaml
- flux-policies/imagerepository.yaml
- flux-policies/imageupdateautomation.yaml
- flux-policies/nexus-ca.yaml

patchesJson6902:
  - target:
      kind: Ingress
      name: spell-registry
      version: v1
    patch: |-
      - op: replace
        path: "/spec/rules/0/host"
        value: "spell-registry.ing-us-s.spo.internal.ses.com"
      - op: replace
        path: "/spec/tls/0/hosts/0"
        value: "spell-registry.ing-us-s.spo.internal.ses.com"
