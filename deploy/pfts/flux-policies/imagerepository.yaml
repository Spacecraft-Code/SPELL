kind: ImageRepository
metadata:
  name: spell-server
spec:
  certSecretRef:
    name: nexus-ca
  image: bzengnexus1.idmz.eng.ses/spell/spell-server
  interval: 1m0s
  secretRef:
    name: bzengnexus-secret