apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spell-git-access
spec:
  refreshInterval: "15s" # synchronisation
  secretStoreRef:
    name: spell-vault-backend
    kind: SecretStore
 
  data:
    - secretKey: id_rsa
      remoteRef:
        key:  /spell-git-access
        property: id_rsa
    - secretKey: id_rsa.pub
      remoteRef:
        key:  /spell-git-access
        property: id_rsa.pub
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ldap-secret
spec:
  refreshInterval: "15s" # synchronisation
  secretStoreRef:
    name: spell-vault-backend
    kind: SecretStore
  data:
    - secretKey: ldap-secret
      remoteRef:
        key:  /ldap-secret
        property: ldap-secret