# Default values for spell-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

serviceAccountName: spell-sa
image:
  registry: bzengnexus1.idmz.eng.ses
spell_server:
  version: v2.6.6.5-dev # {"$imagepolicy": "spell:spell-server:tag"}
  driver:
    name: scorpio
    env:
      NODE_ID_ses24prod: "3369"
      NODE_NAME_3369: ses24prod
    properties:
      key: value
    settings:
      archiva: "ses24prod"
      FLEETLIMITS: limitsdb-api.limitsdb.svc:8080
      FLEETLIMITS_SEAT: VALP
      SATDB: satdb-api.satdb.svc:8080
      cws: "ses24prod"
      obus: obus-server.obus.svc:54407
  maxprocs: 15
  mission: SES24
  family: SBNEO
  seat: ""
  applicable_missions:
    SBNEO: SES24
  input_folder: "{{ .Values.spell_server.mission }}/InputFiles"
  output_folder: "{{ .Values.spell_server.mission }}/OutputFiles"
  additionalInitSteps: "[ -d '/etc/pki/tls/private/wrapped_keys/' ] && (cd /etc/pki/tls/private/wrapped_keys/ && unzip -u ses24-keys.zip) || echo 'Could not find encryption key archive!'"
  additionalVolumeMounts: 
  - mountPath: /etc/pki/tls/private/wrapped_keys/
    name: ses24-certs-folder
  - mountPath: /etc/pki/tls/private/wrapped_keys/ses24-keys.zip
    name: ses24-encryption-keys
    subPath: ses24-keys.zip
  - mountPath: /etc/pki/tls/ses24_keys/ses24_rsa.pem
    name: ses24-encryption-cert
    subPath: ses24_rsa.pem
  additionalVolumes: 
  - name: ses24-certs-folder
    emptyDir:
      sizeLimit: 100Mi
      medium: Memory
  - name: ses24-encryption-cert
    secret:
      secretName: ses24-encryption-cert
      optional: true 
      defaultMode: 0400
  - name: ses24-encryption-keys
    secret:
      secretName: ses24-encryption-keys
      optional: true 
      defaultMode: 0400
procedures:
  size: 5Gi
  repo_folder: SES24
  branch: OPS
  server: prengrcs1.idmz.eng.ses
  known_hosts: |-
    propsrcs1.idmz.soc.ses,10.114.65.65 ssh-rsa 
    bzengrcs1.idmz.eng.ses,10.35.65.65 ssh-rsa 
    prengrcs1.idmz.eng.ses,10.113.65.65 ssh-rsa 

auth:
  ssh:
    version: v2.6.6.5-dev # {"$imagepolicy": "spell:spell-server:tag"}
    ldap:
      url: ldaps://peacdc1.xeneng.ses

service:
  loadBalancerIP: 10.113.45.168