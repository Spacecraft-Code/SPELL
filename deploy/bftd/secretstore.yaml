# Expected Structure:
# spell-git-access: {"id_rsa":"", "id_rsa.pub":""}
# ldap-access: {}
#
#
#
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: spell-vault-backend
spec:
  provider:
    vault:
      server: "https://vault.vault:8200"
      path: "soe/secret/spell"
      version: "v2"
      caProvider:
        type: "Secret"
        name: "vault-ca"
        key: "ca.crt"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "serviceaccount"
          serviceAccountRef:
            name: "default"
