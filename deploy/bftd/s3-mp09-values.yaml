# Default values for spell-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

serviceAccountName: spell-sa
image:
  registry: bzengnexus1.idmz.eng.ses
spell_server:
  version: v2.6.5.1-dev # {"$imagepolicy": "spell:spell-server:tag"}
  driver:
    name: scorpio
    properties:
      key: value
    settings:
      cws: "{{ .Values.spell_server.seat | lower }}cntl"
      archiva: "{{ .Values.spell_server.seat | lower }}dbs01.scorpio.eng.ses"
      obus: bfts-ob.eng.ses:54407
  maxprocs: 15
  ssh_port: 22
  mission: ZMP09
  family: BSS702SP
  seat: S3
  applicable_missions:
    MPOWER: MP01,ZMP01,ZMP02,ZMP03,ZMP04,ZMP05,ZMP06,ZMP07,ZMP08,ZMP09,ZMP10,ZMP11
  input_folder: "{{ .Values.spell_server.mission }}/InputFiles/{{ substr 1 99999 .Values.spell_server.mission }}"
  output_folder: "{{ .Values.spell_server.mission }}/OutputFiles/{{ substr 1 99999 .Values.spell_server.mission }}"
procedures:
  size: 5Gi
  repo_folder: MPOWER
  branch: SIM
  server: bzengrcs1.idmz.eng.ses
  known_hosts: |-
    bzengrcs1.idmz.eng.ses,10.35.65.65 ssh-rsa 
    prengrcs1.idmz.eng.ses,10.113.65.65 ssh-rsa 
