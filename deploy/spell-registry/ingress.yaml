# https://kubernetes.io/docs/concepts/services-networking/ingress/#the-ingress-resource

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spell-registry
  labels:
    app.kubernetes.io/name: spell-registry
    app.kubernetes.io/instance: spell
    app.kubernetes.io/version: "1.0.0"
spec:
  rules:
  - host: spell-registry.ing-lu-s.spo.internal.ses.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spell-registry
            port:
              number: 8080
  tls:
  - secretName: ingress-tls
    hosts:
      - spell-registry.ing-lu-s.spo.internal.ses.com